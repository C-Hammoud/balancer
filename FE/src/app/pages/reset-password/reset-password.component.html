<div class="auth-page">
  <div class="auth-card">
    <p class="eyebrow">Finance Tracker</p>
    <h1>Choose new password</h1>

    @if (done()) {
      <p class="sub">Your password was updated. Sign in with your new password.</p>
      <button type="button" class="btn primary" (click)="goLogin()">Sign in</button>
    } @else if (!linkValid) {
      <p class="sub">This reset link is invalid or incomplete.</p>
      <p class="footer">
        <a routerLink="/forgot-password">Request a new link</a>
        ·
        <a routerLink="/login">Sign in</a>
      </p>
    } @else {
      <p class="sub">Enter a new password for your account.</p>

      <form [formGroup]="form" (ngSubmit)="submit()">
        <label>
          New password
          <input type="password" formControlName="password" autocomplete="new-password" />
        </label>
        <label>
          Confirm password
          <input type="password" formControlName="password_confirm" autocomplete="new-password" />
        </label>
        <button class="btn primary" type="submit" [disabled]="loading()">
          {{ loading() ? 'Saving…' : 'Update password' }}
        </button>
      </form>

      <p class="footer">
        <a routerLink="/login">Back to sign in</a>
      </p>
    }
  </div>
</div>
