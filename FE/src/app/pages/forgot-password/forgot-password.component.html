<div class="auth-page">
  <div class="auth-card">
    <p class="eyebrow">Finance Tracker</p>
    <h1>Reset password</h1>
    @if (sent()) {
      <p class="sub">
        If an account exists, check your email for a reset link. The link expires after a short time.
      </p>
      <p class="footer">
        <a routerLink="/login">Back to sign in</a>
      </p>
    } @else {
      <p class="sub">Enter the email or username on your account. We will send reset instructions.</p>

      <form [formGroup]="form" (ngSubmit)="submit()">
        <label>
          Email or username
          <input formControlName="identifier" autocomplete="username" />
        </label>
        <button class="btn primary" type="submit" [disabled]="loading()">
          {{ loading() ? 'Sending…' : 'Send reset link' }}
        </button>
      </form>

      <p class="footer">
        Remember your password?
        <a routerLink="/login">Sign in</a>
      </p>
    }
  </div>
</div>
