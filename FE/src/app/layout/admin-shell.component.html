<div class="console">
  <aside class="side" aria-label="Admin">
    <div class="side-head">
      <a routerLink="/admin" class="brand">Admin console</a>
      <span class="who">{{ user()?.username }}{{ user()?.is_superuser ? ' · superuser' : '' }}</span>
    </div>

    <nav class="side-nav">
      @for (item of items; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: !!item.exact }">
          <span>{{ item.label }}</span>
          @if (item.badge === 'tickets' && ticketBadge() > 0) {
            <span class="badge">{{ ticketBadge() }}</span>
          }
        </a>
      }
    </nav>

    <div class="side-foot">
      <a routerLink="/dashboard" class="back">← Back to app</a>
      <button type="button" class="logout" (click)="logout()">Log out</button>
    </div>
  </aside>

  <main class="content">
    <router-outlet />
  </main>
</div>
